name: Kit checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Validate source and run local examples
        run: npm run verify
      - name: Build the curated archive from the clean checkout
        run: npm run package -- --require-clean

# Pinned official action releases checked 2026-10-22:
# https://github.com/actions/checkout/releases/tag/v7.0.1
# https://github.com/actions/setup-node/releases/tag/v7.1.0
